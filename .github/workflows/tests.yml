name: tests

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        # ZTS runs the thread pool's rows instead of skipping them.
        ts: [nts, zts]
        # Security floor (composer.json "php": "~8.4.27||^8.5.12"): each line's lowest patched release.
        include:
          - php: '8.4'
            min: '8.4.27'
          - php: '8.5'
            min: '8.5.12'

    name: PHP ${{ matrix.php }} ${{ matrix.ts }}

    # The Database, Cache, Queue, Broadcasting and Graph suites run against these; each test
    # works in tables, keys and labels of its own and drops them after.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: venusian_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

      postgres:
        image: postgres:15
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: framework
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/venusian-ci-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd="cypher-shell -u neo4j -p venusian-ci-password 'RETURN 1'"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=30

    env:
      # Neo4j community has only the neo4j database, and refuses its default password.
      NEO4J_TEST_DATABASE: neo4j
      NEO4J_TEST_PASSWORD: venusian-ci-password

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # ZTS adds ext-parallel. Swoole stays out: loaded beside ext-parallel in a ZTS PHP, a thread crashes or hangs.
          extensions: curl, dom, gmp, intl, libxml, mbstring, pcntl, posix, pdo_sqlite, pdo_mysql, pdo_pgsql, redis, zip${{ matrix.ts == 'zts' && ', parallel, :swoole' || '' }}
          coverage: none
        env:
          phpts: ${{ matrix.ts == 'zts' && 'ts' || 'nts' }}
          # the newest patch of the line, never a cached older build
          update: true

      - name: Refuse a PHP below the patched floor
        env:
          PHP_FLOOR: ${{ matrix.min }}
        run: |
          php -r 'if (version_compare(PHP_VERSION, getenv("PHP_FLOOR"), "<")) { fwrite(STDERR, "PHP ".PHP_VERSION." is below the patched floor ".getenv("PHP_FLOOR").PHP_EOL); exit(1); } echo "PHP ".PHP_VERSION.PHP_EOL;'

      - name: Install Composer dependencies
        run: composer update --prefer-stable --no-interaction --no-progress

      # Graph's client is only suggested; the live Graph tests need it.
      - name: Install the Neo4j client for the Graph tests
        run: composer require --dev laudis/neo4j-php-client:^3.3 --prefer-stable --no-interaction --no-progress

      # Without this, a ZTS runner that cannot run threads would skip every thread row and pass.
      - name: Require a PHP that runs threads, without swoole
        if: matrix.ts == 'zts'
        run: |
          # shellcheck disable=SC2016 # the $ names are PHP's, single-quoted on purpose
          php -r 'require "vendor/autoload.php";
            if (extension_loaded("swoole")) { fwrite(STDERR, "swoole is loaded: it breaks ext-parallel in a ZTS PHP".PHP_EOL); exit(1); }
            $probe = Voyager\IOPools\WorkerPools\Thread\ThreadSupport::probe();
            echo $probe->reason, PHP_EOL;
            exit($probe->supported ? 0 : 1);'

      - name: Execute tests
        run: vendor/bin/pest

      # Level 1 from phpstan.neon, on one cell.
      - name: Analyse with PHPStan
        if: matrix.php == '8.4' && matrix.ts == 'nts'
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

