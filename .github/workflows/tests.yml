name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    name: PHP ${{ matrix.php }}

    # The Database, Cache, Queue, Broadcasting and Graph suites run against these; each test
    # works in tables, keys and labels of its own and drops them after.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: blog
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

      postgres:
        image: postgres:15
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: framework
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/venusian-ci-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd="cypher-shell -u neo4j -p venusian-ci-password 'RETURN 1'"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=30

    env:
      # Neo4j community has only the neo4j database, and refuses its default password.
      NEO4J_TEST_DATABASE: neo4j
      NEO4J_TEST_PASSWORD: venusian-ci-password

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, gmp, intl, libxml, mbstring, pcntl, posix, pdo_sqlite, pdo_mysql, pdo_pgsql, redis, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer update --prefer-stable --no-interaction --no-progress

      # Graph's client is only suggested; the live Graph tests need it.
      - name: Install the Neo4j client for the Graph tests
        run: composer require --dev laudis/neo4j-php-client:^3.3 --prefer-stable --no-interaction --no-progress

      - name: Execute tests
        run: vendor/bin/pest
