name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [8.4, 8.5]

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # intl is required by Voyager\NutsAndBolts\DataObjects\Number
          extensions: dom, curl, libxml, mbstring, intl, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer update --prefer-stable --no-interaction --no-progress

      - name: Execute tests
        run: vendor/bin/pest
